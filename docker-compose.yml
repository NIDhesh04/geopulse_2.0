version: '3.8'

services:
  db:
    image: postgis/postgis:latest
    environment:
      POSTGRES_USER: geopulse
      POSTGRES_PASSWORD: password
      POSTGRES_DB: geopulse_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  api:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgresql://geopulse:password@db:5432/geopulse_db
      - REDIS_URL=redis://redis:6379

volumes:
  pgdata:
