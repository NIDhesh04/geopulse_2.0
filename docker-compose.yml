version: '3.8'

services:
  db:
    image: pgrouting/pgrouting:latest
    environment:
      POSTGRES_USER: geopulse
      POSTGRES_PASSWORD: password
      POSTGRES_DB: geopulse_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  api:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgresql://geopulse:password@db:5432/geopulse_db
      - REDIS_URL=redis://redis:6379

  worker:
    build: .
    command: ["python", "-m", "worker.main"]
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgresql://geopulse:password@db:5432/geopulse_db
      - REDIS_URL=redis://redis:6379

  simulator:
    build: .
    command: ["python", "-m", "sim.run", "--scenario", "sim/scenarios/s2.json"]
    depends_on:
      - api
    environment:
      - DATABASE_URL=postgresql://geopulse:password@db:5432/geopulse_db
      - WS_URL=ws://api:8000/ws/ingest
      - ROUTE_API_URL=http://api:8000/route

volumes:
  pgdata:
